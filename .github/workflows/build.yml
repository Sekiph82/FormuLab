name: build

# Builds macOS (.dmg/.app), Windows (NSIS .exe / .msi) and Linux
# (.deb/.rpm/.AppImage) installers. Each platform's installer can only be
# produced on its own runner — hence the matrix. On a `v*` tag push the
# installers are also attached to a draft GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to build for (e.g. v0.4.0). Only needed when
          triggering manually instead of via a tag push — see the
          Phase 12 Session 3 external log for why this exists: a real
          `v0.4.0` tag push did not trigger this workflow on this
          repository (confirmed twice), while `workflow_dispatch` fired
          normally, isolating the problem to the tag-push trigger
          specifically. Leave blank for a plain build with no release.
        required: false
        default: ""

# tauri-action needs to create the draft release and upload assets.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Phase 12 Session 3: this repository's first public release is
      # deliberately Windows-only. The macOS and Linux legs below are
      # real, working config (kept, not deleted) but have never had a
      # published release built or independently verified from them —
      # publishing untested mac/Linux binaries would contradict this
      # release's own notes, which state Windows x64 as the only
      # currently supported platform. Re-enable them for a future
      # multi-platform release once each has been independently verified.
      matrix:
        include:
          # - platform: macos-latest
          #   target: aarch64-apple-darwin
          # - platform: macos-latest
          #   target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # - platform: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled skills
        shell: bash
        run: bash scripts/dev/fetch-skills.sh

      - name: Fetch bundled uv sidecar
        shell: bash
        run: bash scripts/dev/fetch-uv.sh ${{ matrix.target }}

      - name: Build the app (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # Linux: deb+rpm only. AppImage was originally disabled because
          # linuxdeploy's ldd check aborted on a since-removed bundled
          # OpenCode sidecar (tauri-apps/tauri#8929). That sidecar (and its
          # CI fetch step) no longer exists (Phase 12 Session 2A) — whether
          # AppImage can now be safely re-enabled has not been re-tested,
          # so it stays off pending that verification, not because the
          # original blocker is still believed to apply.
          args: --target ${{ matrix.target }} ${{ startsWith(matrix.platform, 'ubuntu') && '--bundles deb,rpm' || '' }}
          # On a v* tag push, attach installers to a draft GitHub Release.
          # A manual workflow_dispatch run with the `tag` input set does
          # the same (see the `on.workflow_dispatch.inputs.tag` comment
          # above for why this exists). Empty tagName skips release
          # creation entirely (a plain build-only dispatch).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: ${{ github.ref_type == 'tag' && format('FormuLab {0}', github.ref_name) || (inputs.tag && format('FormuLab {0}', inputs.tag) || '') }}
          releaseDraft: true
          # Standing install/first-launch notes — every draft is born with these
          # (the builds are unsigned/un-notarized, so users must clear Gatekeeper /
          # SmartScreen once). Prepend the per-version changelog before publishing.
          releaseBody: |
            ## ⚠️ Install & first launch — unsigned builds

            These installers are **not code-signed or notarized**, so your OS warns on first launch. This is expected; clear it once:

            **macOS** — Apple Silicon: `…_aarch64.dmg` · Intel: `…_x64.dmg` (requires macOS 13+)
            1. Open the DMG and drag **FormuLab** into Applications.
            2. If you see *"… is damaged and can't be opened"* or *"unidentified developer"*, clear the quarantine attribute in Terminal, then open normally:
               ```
               xattr -cr "/Applications/FormuLab.app"
               ```

            **Windows** — `…_x64-setup.exe` or `…_x64_en-US.msi`
            - SmartScreen shows *"Windows protected your PC"* → **More info** → **Run anyway**.

            **Linux** — `.deb` / `.rpm`
            - `sudo apt install ./…_amd64.deb`  or  `sudo rpm -i …x86_64.rpm`

            > **No in-app auto-update** — download new versions from this Releases page. (The `.app.tar.gz` assets are build artifacts, not an update channel.)

            ---

            <!-- Prepend this release's changelog above this line before publishing. -->

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: formulab-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: warn
